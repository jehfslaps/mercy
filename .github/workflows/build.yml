name: build

# Every push builds Windows (VST3 + CLAP) and Mac (VST3 + AU + CLAP, Apple Silicon), checks the plugins,
# and proves Windows and Mac sound bit-identical and look the same.
# Downloads: the "Latest build" release on the repo page (Mercy Windows + Mac zips, 000 teaser zip).
# It is a DRAFT release: the repo is public (free Actions minutes), but drafts are only visible to the owner,
# so the builds are not downloadable by the public.
# Nothing here uses Actions artifact storage (it filled up and stays blocked for the month): files pass
# between jobs through the Actions cache, and the zips go to the release.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish the zips to the "Latest build" release

env:
  VERSION: "2.1"
  WIN: >-
    BUILD_DIR_SUFFIX=-win DPF_BUILD_DIR=../build/win DPF_TARGET_DIR=../bin/win
    CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ AR=x86_64-w64-mingw32-ar WINDRES=x86_64-w64-mingw32-windres
  LIN: BUILD_DIR_SUFFIX= DPF_BUILD_DIR=../build/linux DPF_TARGET_DIR=../bin/linux

jobs:
  # ---------------------------------------------------------------------------------------- keep the downloads private
  hide-downloads:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release edit latest-build --draft=true -R "$GITHUB_REPOSITORY" || true

  # ---------------------------------------------------------------------------------------- Windows build (+ Linux test build)
  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev xvfb pkg-config python3-pil zip nsis
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Linux build (tests and the reference screenshots only)
        run: |
          cd src
          make -j4 $LIN
          make render $LIN
          cp ../dpf/build/libdgl-opengl.a ../test/libdgl-linux.a
      - name: Reference screenshots
        run: tools/screenshots.sh linux out/screens-reference
      - name: Windows build (VST3 + CLAP)
        run: |
          make -C dpf clean
          cd src
          make -j4 $WIN
          make render $WIN
      - name: Windows binary imports only system DLLs
        run: x86_64-w64-mingw32-objdump -p bin/win/Mercy.vst3/Contents/x86_64-win/Mercy.vst3 | grep "DLL Name"
      - name: 000 (teaser build, Windows VST3 + CLAP)
        run: make -C src -j4 $WIN TEASER=true
      - name: Package Windows zips
        run: |
          tools/package.sh windows bin/win $VERSION
          tools/package.sh teaser bin/win $VERSION
      - name: Publish to the "Latest build" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --draft --prerelease --title "Latest build" --notes "Built automatically from every push." || true
          gh release edit latest-build --draft=true || true   # downloads stay private (drafts: only you see them)
          gh release upload latest-build out/Mercy_v*_Windows.zip out/000_Windows.zip --clobber
          gh release edit latest-build --notes "Built automatically from commit ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC'))." || true
      - uses: actions/cache/save@v4
        with:
          key: ci-${{ github.run_id }}-${{ github.run_attempt }}-tools-windows
          enableCrossOsArchive: true
          path: |
            bin/win/mercy-render.exe
            bin/win/Mercy.vst3
      - uses: actions/cache/save@v4
        with:
          key: ci-${{ github.run_id }}-${{ github.run_attempt }}-screens-reference
          enableCrossOsArchive: true
          path: |
            out/screens-reference

  # ---------------------------------------------------------------------------------------- Windows: real Windows checks
  windows-check:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          key: ci-${{ github.run_id }}-${{ github.run_attempt }}-tools-windows
          enableCrossOsArchive: true
          path: |
            bin/win/mercy-render.exe
            bin/win/Mercy.vst3
      - name: Sound check render (Windows)
        shell: bash
        run: |
          mkdir -p out/render-windows
          bin/win/mercy-render.exe test/dry_loop.wav out/render-windows
          mkdir -p hashes && cp out/render-windows/hashes.txt hashes/windows.txt
      - uses: actions/cache/save@v4
        with:
          key: ci-${{ github.run_id }}-${{ github.run_attempt }}-hashes-windows
          enableCrossOsArchive: true
          path: |
            hashes/windows.txt
      - name: pluginval (VST3)
        shell: bash
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pv.zip -d pv
          # no GPU on the Windows runner, so the editor (OpenGL) tests are skipped here; the Mac job opens the editor
          tools/ci_run.sh "pluginval VST3 (Windows)" pv/pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process --output-dir out/pluginval-windows --validate "bin/win/Mercy.vst3"

  # ---------------------------------------------------------------------------------------- Mac (Apple Silicon)
  mac:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build VST3 + AU + CLAP (arm64)
        run: |
          MAC="BUILD_DIR_SUFFIX=-mac DPF_BUILD_DIR=../build/mac DPF_TARGET_DIR=../bin/mac SKIP_STRIPPING=true"
          tools/ci_run.sh "Mac build" make -C src -j4 $MAC
          tools/ci_run.sh "Mac render tool" make -C src render $MAC
      - name: Apple Silicon only
        run: |
          lipo -archs bin/mac/Mercy.vst3/Contents/MacOS/Mercy
          lipo -archs bin/mac/Mercy.component/Contents/MacOS/Mercy
          test "$(lipo -archs bin/mac/Mercy.component/Contents/MacOS/Mercy)" = "arm64"
      - name: Sign (ad-hoc for now; Developer ID once the Apple membership is set up)
        run: |
          codesign --force --deep --sign - bin/mac/Mercy.vst3
          codesign --force --deep --sign - bin/mac/Mercy.component
          codesign --force --deep --sign - bin/mac/Mercy.clap
      - name: Sound check render (Mac)
        run: |
          mkdir -p out/render-mac
          bin/mac/mercy-render test/dry_loop.wav out/render-mac
          mkdir -p hashes && cp out/render-mac/hashes.txt hashes/mac.txt
      - name: Screenshots (Mac)
        continue-on-error: true
        run: tools/ci_run.sh "Mac screenshots" tools/screenshots.sh mac out/screens-mac
      - name: Package Mac zip
        run: tools/package.sh mac bin/mac $VERSION
      - name: Publish to the "Latest build" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --draft --prerelease --title "Latest build" --notes "Built automatically from every push." || true
          gh release edit latest-build --draft=true || true   # downloads stay private (drafts: only you see them)
          gh release upload latest-build out/Mercy_v*_Mac.zip --clobber
          gh release edit latest-build --notes "Built automatically from commit ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC'))." || true
      - uses: actions/cache/save@v4
        with:
          key: ci-${{ github.run_id }}-${{ github.run_attempt }}-hashes-mac
          enableCrossOsArchive: true
          path: |
            hashes/mac.txt
      - uses: actions/cache/save@v4
        with:
          key: ci-${{ github.run_id }}-${{ github.run_attempt }}-screens-mac
          enableCrossOsArchive: true
          path: |
            out/screens-mac
      - name: Install into the user plug-in folders
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3
          cp -R bin/mac/Mercy.component ~/Library/Audio/Plug-Ins/Components/
          cp -R bin/mac/Mercy.vst3 ~/Library/Audio/Plug-Ins/VST3/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
      - name: auval (the same check Logic runs)
        run: |
          auval -a | grep -i mercy || (sleep 5; auval -a | grep -i mercy) || true
          tools/ci_run.sh "auval" bash -c 'set -o pipefail; auval -strict -v aufx MrDp Mrcy | tee auval.txt' || true
          echo "::notice title=auval::$(grep -E 'VALIDATION|FAIL|WARNING' auval.txt | head -5 | tr '\n' ' ')"
          grep -q "AU VALIDATION SUCCEEDED" auval.txt
      - name: pluginval (VST3 and AU, opens the editor)
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pv.zip -d pv
          PV=pv/pluginval.app/Contents/MacOS/pluginval
          tools/ci_run.sh "pluginval VST3 (Mac)" $PV --strictness-level 5 --validate-in-process --output-dir out/pluginval-mac --validate ~/Library/Audio/Plug-Ins/VST3/Mercy.vst3
          tools/ci_run.sh "pluginval AU no-editor (Mac)" $PV --strictness-level 5 --skip-gui-tests --validate-in-process --output-dir out/pluginval-mac --validate ~/Library/Audio/Plug-Ins/Components/Mercy.component && echo "::notice title=pluginval AU without editor tests::passed" || true
          # under the debugger, up to 8 times (the crash is intermittent): report the first crash in chunks
          for n in 1 2 3 4 5 6 7 8; do
            lldb --batch -o "process handle SIGSEGV SIGBUS SIGABRT -s true -p false" -o run -k "bt 30" -k "image lookup -va \$pc" -k "bt all 12" -k quit -- $PV --strictness-level 5 --validate-in-process --validate ~/Library/Audio/Plug-Ins/Components/Mercy.component > lldb.txt 2>&1 || true
            if grep -q "stop reason = EXC\|stop reason = signal" lldb.txt; then
              sed -n '/stop reason = EXC\|stop reason = signal/,$p' lldb.txt | grep -v "^\s*$" > crash.txt
              split -b 3000 crash.txt crashpart_
              k=1; for f in crashpart_*; do echo "::error title=AU crash (attempt $n) part $k::$(sed -e 's/%/%25/g' -e 's/::/: :/g' "$f" | awk '{printf "%s%%0A", $0}')"; k=$((k+1)); [ $k -gt 8 ] && break; done
              break
            fi
            echo "::notice title=pluginval AU under debugger::attempt $n passed"
          done
          tools/ci_run.sh "pluginval AU (Mac)" $PV --strictness-level 5 --validate-in-process --output-dir out/pluginval-mac --validate ~/Library/Audio/Plug-Ins/Components/Mercy.component

  # ---------------------------------------------------------------------------------------- same sound, same look
  compare:
    needs: [windows-build, windows-check, mac]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          key: ci-${{ github.run_id }}-${{ github.run_attempt }}-screens-reference
          enableCrossOsArchive: true
          path: |
            out/screens-reference
      - uses: actions/cache/restore@v4
        with:
          key: ci-${{ github.run_id }}-${{ github.run_attempt }}-hashes-windows
          enableCrossOsArchive: true
          path: |
            hashes/windows.txt
      - uses: actions/cache/restore@v4
        with:
          key: ci-${{ github.run_id }}-${{ github.run_attempt }}-hashes-mac
          enableCrossOsArchive: true
          path: |
            hashes/mac.txt
      - uses: actions/cache/restore@v4
        with:
          key: ci-${{ github.run_id }}-${{ github.run_attempt }}-screens-mac
          enableCrossOsArchive: true
          path: |
            out/screens-mac
      - name: Sound - Windows vs Mac (must be bit-identical)
        run: |
          tr -d '\r' < hashes/windows.txt > w.txt; tr -d '\r' < hashes/mac.txt > m.txt
          W=w.txt; M=m.txt
          total=$(wc -l < $W); same=$(comm -12 <(sort $W) <(sort $M) | wc -l)
          msg="$total scenarios: $same bit-identical, $((total - same)) different"
          echo "### Sound: Windows vs Mac" >> $GITHUB_STEP_SUMMARY; echo "$msg" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Sound Windows vs Mac::$msg"
          if [ "$same" != "$total" ] || [ "$total" = "0" ]; then
            echo "::error title=Different on Mac::$(diff <(sort -k2 $W) <(sort -k2 $M) | grep '^>' | head -20 | awk '{printf "%s%%0A", $3}')"
            exit 1
          fi
      - name: Look - reference vs Mac
        run: |
          sudo apt-get install -y -qq python3-pil
          python3 tools/compare_screens.py out/screens-reference out/screens-mac out/screens-compare || echo "LOOK_FAILED=1" >> $GITHUB_ENV
          cat out/screens-compare/report.md >> $GITHUB_STEP_SUMMARY
          if [ -f out/screens-compare/map.txt ]; then echo "::notice title=Where the Mac screenshot differs::$(awk '{printf "%s%%0A", $0}' out/screens-compare/map.txt)"; fi
          if [ -f out/screens-compare/art.txt ]; then echo "::notice title=Difference close-up::$(awk '{printf "%s%%0A", $0}' out/screens-compare/art.txt)"; fi
          echo "::notice title=Look reference vs Mac::$(grep -E '\| s_' out/screens-compare/report.md | awk -F'|' '{printf "%s %s %s;", $2, $3, $4}')"
      - name: Fail if the Mac interface looks different
        run: test -z "$LOOK_FAILED"
